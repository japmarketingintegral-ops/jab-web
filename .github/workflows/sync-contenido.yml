name: Sync Instagram -> blog + LinkedIn

on:
  schedule:
    # 09:00 ART (12:00 UTC). Una vez al día alcanza -- esto no es sincronizar
    # datos en vivo, es revisar si hay contenido nuevo para expandir.
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Correr el sync
        env:
          SUPABASE_URL: ${{ secrets.JAB_CRM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JAB_CRM_SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Token de "Member authorization code" (perfil personal de Santiago).
          # Mientras LinkedIn no apruebe "Sign In with LinkedIn using OpenID
          # Connect" en la app, publicarLinkedin() no puede identificar al
          # miembro y cae solo a guardar el borrador -- no hace falta tocar
          # nada acá cuando se apruebe. Ojo: este token vence a los 2 meses y
          # no tiene refresh automático (limitación de LinkedIn, no del
          # código) -- hay que regenerarlo a mano cada tanto.
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: node scripts/sync-contenido/index.mjs

      - name: Commitear lo que se haya generado
        run: |
          git config user.name "jab-content-sync"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/blog/ public/assets/img/blog/ scripts/sync-contenido/procesados.json
          # linkedin-borradores/ y linkedin-publicados/ recién se crean si
          # hubo al menos un post educativo -- `git add` sobre un path que no
          # existe todavía falla duro (pathspec did not match), así que se
          # agregan sólo si están.
          [ -d linkedin-borradores ] && git add linkedin-borradores/
          [ -d linkedin-publicados ] && git add linkedin-publicados/
          git diff --cached --quiet || git commit -m "Sync automático: Instagram -> blog + LinkedIn"
          git push
